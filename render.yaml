# Alternative gratuite au VPS pour le proxy de flux : Render (Blueprint).
# Dashboard Render -> New -> Blueprint -> ce dépôt. Render génère STREAM_PROXY_SECRET :
# copier sa valeur dans Vercel (même secret des deux côtés).
# URL publique : https://<nom>.onrender.com
#
# Limites du plan gratuit : mise en veille après 15 min sans requête (environ
# 1 min pour repartir) et trafic sortant limité ; sans moyen de paiement, un
# dépassement suspend le service jusqu'au mois suivant.
services:
  - type: web
    name: oria-stream-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./apps/stream-proxy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: STREAM_PROXY_SECRET
        generateValue: true
