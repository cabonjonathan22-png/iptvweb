# Alternative gratuite au VPS pour le proxy de flux : Render (Blueprint).
# Dashboard Render -> New -> Blueprint -> ce dépôt. Renseigner STREAM_PROXY_SECRET
# (même valeur que dans Vercel). URL publique : https://<nom>.onrender.com
#
# Limites du plan gratuit : mise en veille après 15 min sans requête (premier
# lancement de chaîne ~30-60 s), ~100 Go de trafic sortant par mois (environ
# 40 h de HD). Pour un usage quotidien, préférer Oracle Cloud Always Free
# (apps/stream-proxy/deploy/setup.sh).
services:
  - type: web
    name: oria-stream-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./apps/stream-proxy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: STREAM_PROXY_SECRET
        sync: false
